[System]
IconThemeName=Papirus
FallbackIconThemeName=hicolor
SuCommand=lxsudo dbus-run-session -- %s
Terminal=qterminal

[Behavior]
BookmarkOpenMethod=0
UseTrash=true
SingleClick=false
ConfirmDelete=true

[Desktop]
DesktopShortcuts=Home, Trash, Computer, Network
WallpaperMode=stretch
Wallpaper=/usr/share/backgrounds/nexaos/nexaos-default.svg
BgColor=#0b1220
FgColor=#edf3ff
ShadowColor=#050914
ShowHidden=false
SortOrder=ascending
SortColumn=name
Font="Noto Sans,10,-1,5,50,0,0,0,0,0"

[Volume]
MountOnStartup=true
MountRemovable=true
AutoRun=false

[FolderView]
Mode=icon
ShowHidden=false
SortOrder=ascending
SortColumn=name
BigIconSize=48
SmallIconSize=24
SidePaneIconSize=24
ThumbnailIconSize=128

[Window]
FixedHeight=600
FixedWidth=800
LastWindowHeight=800
LastWindowWidth=1100
RememberWindowSize=true
AlwaysShowTabs=false
ShowTabClose=true
SplitterPos=250
SidePaneMode=0

[Thumbnail]
ShowThumbnails=true
MaxThumbnailFileSize=4096
ThumbnailLocalFilesOnly=true
