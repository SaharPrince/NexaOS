name: NCE-005a evidence consistency

on:
  push:
    branches: [main, nce-001/pe-inspector]
    paths:
      - "docs/milestones/NCE-005a.md"
      - "scripts/check-nce-005a-evidence.py"
      - ".github/workflows/nce-005a-evidence.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/milestones/NCE-005a.md"
      - "scripts/check-nce-005a-evidence.py"
      - ".github/workflows/nce-005a-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Validate sample table and aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check NCE-005a sample and aggregate consistency
        run: python3 scripts/check-nce-005a-evidence.py
