name: NexaOS direct ISO release

on:
  workflow_run:
    workflows: ["NexaOS desktop preview"]
    types: [completed]
    branches:
      - "nce-005c/low-end-resource-baseline"

permissions:
  contents: write
  actions: read

concurrency:
  group: nexaos-iso-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified ISO as a direct release asset
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download ISO and build evidence from the successful run
        uses: actions/download-artifact@v4
        with:
          name: nexaos-desktop-preview-amd64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input

      - name: Verify ISO and checksum
        run: |
          test -s release-input/nexaos-preview-amd64.iso
          test -s release-input/nexaos-preview-amd64.iso.sha256
          (cd release-input && sha256sum --check nexaos-preview-amd64.iso.sha256)
          mkdir -p release-assets
          cp release-input/nexaos-preview-amd64.iso release-assets/nexaos-preview-amd64.iso
          cp release-input/nexaos-preview-amd64.iso.sha256 release-assets/nexaos-preview-amd64.iso.sha256

      - name: Publish direct ISO download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexaos-preview-${{ github.event.workflow_run.head_sha }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: NexaOS Preview ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
          prerelease: true
          files: |
            release-assets/nexaos-preview-amd64.iso
            release-assets/nexaos-preview-amd64.iso.sha256
