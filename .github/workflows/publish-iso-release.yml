name: NexaOS direct ISO release

on:
  push:
    tags:
      - "nexaos-preview-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: nexaos-iso-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified ISO from matching successful build
    runs-on: ubuntu-24.04
    steps:
      - name: Find successful desktop build for this exact commit
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "desktop-image.yml",
              head_sha: context.sha,
              status: "success",
              per_page: 20
            });
            const run = response.data.workflow_runs.find(item =>
              item.conclusion === "success" &&
              item.head_sha === context.sha &&
              item.head_branch === "nce-005c/low-end-resource-baseline"
            );
            if (!run) {
              core.setFailed("No successful desktop ISO build exists for this exact commit. Push the commit to the development branch and wait for its desktop workflow to pass before tagging it.");
              return;
            }
            core.setOutput("run_id", String(run.id));
            core.info(`Using successful build run ${run.id} for ${context.sha}`);

      - name: Download ISO and build evidence
        uses: actions/download-artifact@v4
        with:
          name: nexaos-desktop-preview-amd64
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input

      - name: Verify ISO and checksum
        run: |
          test -s release-input/nexaos-preview-amd64.iso
          test -s release-input/nexaos-preview-amd64.iso.sha256
          (cd release-input && sha256sum --check nexaos-preview-amd64.iso.sha256)
          mkdir -p release-assets
          cp release-input/nexaos-preview-amd64.iso release-assets/nexaos-preview-amd64.iso
          cp release-input/nexaos-preview-amd64.iso.sha256 release-assets/nexaos-preview-amd64.iso.sha256

      - name: Publish direct ISO download
        uses: softprops/action-gh-release@v2
        with:
          name: NexaOS Preview ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: |
            release-assets/nexaos-preview-amd64.iso
            release-assets/nexaos-preview-amd64.iso.sha256
