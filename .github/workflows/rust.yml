name: Rust checks

on:
  push:
    branches: [main, "nce-001/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Run tests
        run: cargo test --workspace
      - name: Check CLI help
        run: cargo run -p nexa-inspect -- --help
