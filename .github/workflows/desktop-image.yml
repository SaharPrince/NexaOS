name: NexaOS desktop preview

on:
  push:
    paths:
      - "desktop/live-build/config/package-lists/**"
      - "scripts/build-live-image.sh"
      - ".github/workflows/desktop-image.yml"
  pull_request:
    paths:
      - "desktop/live-build/**"
      - "scripts/build-live-image.sh"
      - ".github/workflows/desktop-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexaos-desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-live-image:
    name: Build Debian 13 LXQt live preview
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate build script and package list
        run: |
          bash -n scripts/build-live-image.sh
          test -s desktop/live-build/config/package-lists/nexaos-desktop.list.chroot
          awk 'NF && $1 !~ /^#/ { if (NF != 1) exit 1; count++ } END { if (count == 0) exit 1 }' desktop/live-build/config/package-lists/nexaos-desktop.list.chroot

      - name: Install Debian live-build and host tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            debian-archive-keyring \
            debootstrap \
            xorriso \
            squashfs-tools
          echo "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian trixie main" | sudo tee /etc/apt/sources.list.d/debian-trixie-live-build.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y live-build=1:20250505+deb13u1
          live-build --version

      - name: Build preview ISO
        run: bash scripts/build-live-image.sh

      - name: Upload preview ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: nexaos-desktop-preview-amd64
          path: |
            artifacts/nexaos-preview-amd64.iso
            artifacts/nexaos-preview-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 3
